name: Diagnostic Shopify scopes (manuel, LECTURE SEULE)

# Workflow neuf et indépendant. Aucune écriture dans Shopify, aucune mutation.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances
        run: pip install requests

      - name: Tests hors ligne du diagnostic
        run: python -m unittest -v test_shopify_scope_check

      - name: Diagnostic des scopes du token (lecture seule)
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: python shopify_scope_check.py
